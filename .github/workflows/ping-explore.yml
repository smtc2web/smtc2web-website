name: Ping Kite Explore

# 站点由 Cloudflare Pages 通过 Git 集成自动构建、发布。
# 本工作流只负责：等这次提交在 Cloudflare Pages 上发布成功后，再 ping Explore。
# Cloudflare Pages 没有“部署后”钩子（Deploy Hook 只能触发构建，构建命令结束前资源尚未发布），
# 所以必须由 Pages 之外的流程在发布完成后触发 ping。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# 连续推送时只保留最新一次，避免排队等待旧提交。
concurrency:
  group: ping-explore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Cloudflare Pages deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: smtc2web
          TARGET_SHA: ${{ github.sha }}
        run: node scripts/wait-for-pages-deploy.mjs

      - name: Ping Kite Explore
        env:
          SITE_URL: https://smtc2web.org
        run: node scripts/ping-explore.mjs
